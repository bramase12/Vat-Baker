name: Release VATSystem

on:
  push:
    tags:
      - 'v*' # Trigger on tag push (e.g., v1.0.0)
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          path: temp_project/Assets/VAT
          
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@cf61cecb0523733d0bd2dafa51c814b2909f20a2
        with:
          package-path: VATSystem.unitypackage
          project-folder: temp_project
          include-files: Assets/VAT/Editor Assets/VAT/Runtime Assets/VAT/Shaders Assets/VAT/Characters
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: VATSystem.unitypackage
          generate_release_notes: true
